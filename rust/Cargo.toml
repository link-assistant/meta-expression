[package]
name = "meta-expression-core"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
description = "Rust core primitives for the meta-expression prototype"

[lib]
name = "meta_expression_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
doublets = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.122"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
